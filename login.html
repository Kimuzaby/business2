<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Admin La Abuela</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        /* Estilos específicos para hacer que el Login se vea premium */
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            /* Usamos la misma imagen del Hero con un fondo oscuro */
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.6) 0%, rgba(18, 18, 18, 0.95) 100%), url('img/burguer.WEBP') center/cover no-repeat;
        }
        
        .login-wrapper {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .login-box { 
            background: rgba(30, 30, 30, 0.85); /* Fondo oscuro translúcido */
            backdrop-filter: blur(12px); /* Efecto cristal */
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px; 
            border-radius: 16px; 
            border: 1px solid rgba(212, 168, 71, 0.2); /* Borde dorado sutil */
            text-align: center; 
            width: 100%; 
            max-width: 420px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(0);
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid var(--gold);
        }

        .login-tag {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .login-box h2 { 
            color: #ffffff; 
            margin-bottom: 30px; 
            font-family: 'Playfair Display', serif; 
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            color: #ffffff;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px rgba(212, 168, 71, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: var(--gold);
            color: var(--bg-header);
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .login-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 168, 71, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #error-msg {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--gold);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <img src="img/logo.png" alt="Logo La Abuela" class="login-logo">
            <span class="login-tag">Cocina Urbana</span>
            <h2>Panel de Administración</h2>
            
            <form id="login-form" onsubmit="event.preventDefault(); login();">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="login-input" placeholder="ejemplo@correo.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="login-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="btn-login" class="login-btn">Iniciar Sesión</button>
            </form>

            <div id="error-msg">Credenciales incorrectas. Verifica tu correo y contraseña.</div>

            <a href="index.html" class="back-link">← Volver a la página principal</a>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCbi_zXZbec6_mPbVe7g8sezq6a3rdHO5I",
            authDomain: "la-abuela-cocina-urbana.firebaseapp.com",
            projectId: "la-abuela-cocina-urbana",
            storageBucket: "la-abuela-cocina-urbana.firebasestorage.app",
            messagingSenderId: "156695415462",
            appId: "1:156695415462:web:b6e4c19eb9cd8485678267"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Verificar si ya está logueado para no pedir datos de nuevo
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');
            
            // Estado de carga
            btnLogin.innerHTML = "Verificando...";
            btnLogin.disabled = true;
            errorMsg.style.display = 'none';
            
            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    btnLogin.innerHTML = "¡Acceso Concedido!";
                    btnLogin.style.background = "#25D366"; // Color verde de éxito
                    btnLogin.style.color = "#000";
                    setTimeout(() => {
                        window.location.href = "dashboard.html"; 
                    }, 500);
                })
                .catch((error) => {
                    // Restaurar botón y mostrar error
                    btnLogin.innerHTML = "Iniciar Sesión";
                    btnLogin.disabled = false;
                    errorMsg.style.display = 'block';
                    
                    // Animación de sacudida (shake) para el error
                    const box = document.querySelector('.login-box');
                    box.style.transform = "translateX(-5px)";
                    setTimeout(() => box.style.transform = "translateX(5px)", 50);
                    setTimeout(() => box.style.transform = "translateX(-5px)", 100);
                    setTimeout(() => box.style.transform = "translateX(5px)", 150);
                    setTimeout(() => box.style.transform = "translateX(0)", 200);
                });
        }
    </script>
</body>
</html>
